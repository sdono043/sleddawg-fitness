<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard · Sleddawg Fitness</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1224;--surface:#0f1a30;--surface2:#142035;--surface3:#1a2840;--border:#1e2e4e;--border2:#263654;--text:#f0ede8;--text2:#8896ac;--text3:#4a5a74;--accent:#c8b27a;--accent2:#e8c868;--accent3:#5ab0e8;--red:#ff4444;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}
  body{min-height:100vh;}
  a{text-decoration:none;color:inherit;}

  nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:0.05em;}
  .logo span{color:var(--accent);}
  .nav-links{display:flex;gap:0;}
  .nav-link{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1rem;color:var(--text3);transition:color 0.15s;}
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--accent);}
  .connected-badge{display:flex;align-items:center;gap:0.5rem;font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--accent3);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

  main{max-width:1200px;margin:0 auto;padding:2rem;}

  .page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;gap:1rem;flex-wrap:wrap;}
  .page-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2.5rem;line-height:1;}
  .page-title span{color:var(--accent);}
  .page-sub{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3);margin-top:0.25rem;}

  /* WEEK NAV */
  .week-nav{display:flex;align-items:center;gap:0.75rem;}
  .week-nav button{background:none;border:1px solid var(--border2);color:var(--text2);cursor:pointer;padding:0.4rem 0.75rem;font-size:0.85rem;transition:all 0.15s;}
  .week-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .week-label{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--text2);min-width:160px;text-align:center;}

  /* PLAN INFO BAR */
  .plan-bar{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--border);}
  .plan-bar-empty{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3);}
  .plan-wk{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;white-space:nowrap;}
  .plan-phase-tag{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.15rem 0.4rem;}
  .plan-phase-tag.base{background:rgba(90,176,232,0.15);color:var(--accent3);}
  .plan-phase-tag.build{background:rgba(232,200,104,0.15);color:var(--accent2);}
  .plan-phase-tag.peak{background:rgba(200,178,122,0.15);color:var(--accent);}
  .plan-phase-tag.race-specific{background:rgba(170,136,255,0.15);color:#aa88ff;}
  .plan-phase-tag.taper{background:rgba(255,68,68,0.15);color:var(--red);}
  .plan-phase-tag.race{background:var(--accent);color:var(--bg);}
  .plan-key{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text2);flex:1;}

  /* BIG SCORE */
  .score-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--border);margin-bottom:1.5rem;}
  .score-box{background:var(--surface);padding:1.5rem;position:relative;overflow:hidden;}
  .score-box::after{content:'';position:absolute;bottom:0;left:0;height:3px;background:var(--border2);width:100%;}
  .score-box.green::after{background:var(--accent);}
  .score-box.yellow::after{background:#ffbb00;}
  .score-box.red::after{background:var(--red);}
  .score-box.neutral::after{background:var(--text3);}
  .sb-label{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem;}
  .sb-value{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2.5rem;line-height:1;margin-bottom:0.25rem;}
  .sb-sub{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text2);}
  .sb-status{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;margin-top:0.5rem;}
  .sb-status.green{color:var(--accent);}
  .sb-status.yellow{color:#ffbb00;}
  .sb-status.red{color:var(--red);}
  .sb-status.neutral{color:var(--text3);}

  /* PROGRESS BAR */
  .progress-track{height:6px;background:var(--surface3);border-radius:0;margin-top:0.75rem;overflow:hidden;}
  .progress-fill{height:100%;transition:width 0.5s ease;}
  .progress-fill.green{background:var(--accent);}
  .progress-fill.yellow{background:#ffbb00;}
  .progress-fill.red{background:var(--red);}

  /* PANEL */
  .panel{background:var(--surface);border:1px solid var(--border);padding:1.25rem;margin-bottom:1.5rem;}
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border);}
  .panel-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text2);}
  .panel-badge{font-family:'DM Mono',monospace;font-size:0.65rem;background:var(--surface3);color:var(--text3);padding:0.2rem 0.5rem;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}

  /* DAY-BY-DAY TABLE */
  .day-row{display:grid;grid-template-columns:90px 60px 1fr 1fr 80px;gap:0.75rem;align-items:center;padding:0.625rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
  .day-row:last-child{border-bottom:none;}
  .day-row.header{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;padding-bottom:0.5rem;}
  .dr-day{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text2);}
  .dr-type{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.65rem;text-transform:uppercase;padding:0.15rem 0.4rem;text-align:center;}
  .dr-type.Run{background:rgba(200,178,122,0.15);color:var(--accent);}
  .dr-type.Swim{background:rgba(90,176,232,0.15);color:var(--accent3);}
  .dr-type.Ride{background:rgba(232,200,104,0.15);color:var(--accent2);}
  .dr-type.Walk,.dr-type.Other{background:rgba(255,255,255,0.08);color:var(--text2);}
  .dr-type.Strength{background:rgba(170,136,255,0.15);color:#aa88ff;}
  .dr-type.Rest,.dr-type.—{background:transparent;color:var(--text3);}
  .dr-planned{color:var(--text3);font-family:'DM Mono',monospace;font-size:0.7rem;}
  .dr-actual{font-family:'DM Mono',monospace;font-size:0.7rem;}
  .dr-actual.beat{color:var(--accent);}
  .dr-actual.close{color:var(--accent3);}
  .dr-actual.miss{color:var(--red);}
  .dr-actual.rest{color:var(--text3);}
  .dr-status{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;}
  .dr-status.beat{color:var(--accent);}
  .dr-status.close{color:var(--accent3);}
  .dr-status.miss{color:var(--red);}
  .dr-status.rest{color:var(--text3);}
  .dr-status.pending{color:var(--text3);}

  /* HR ZONES */
  .hr-zone-row{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.625rem;}
  .hz-label{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);width:60px;}
  .hz-range{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text2);width:80px;}
  .hz-bar-track{flex:1;height:8px;background:var(--surface3);}
  .hz-bar{height:100%;transition:width 0.5s;}
  .hz-pct{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text2);width:36px;text-align:right;}
  .hr-note{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3);padding:1rem;text-align:center;}

  /* STREAK */
  .streak-dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:0.5rem;}
  .streak-dot{width:12px;height:12px;border-radius:2px;}
  .streak-dot.active{background:var(--accent);}
  .streak-dot.rest{background:var(--surface3);}
  .streak-dot.missed{background:rgba(255,68,68,0.3);}

  .loading{display:flex;align-items:center;gap:0.5rem;font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--text3);padding:1rem;}
  .spinner{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:2rem;color:var(--text3);font-family:'DM Mono',monospace;font-size:0.75rem;}

  @media(max-width:768px){
    .score-hero{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
    .day-row{grid-template-columns:70px 50px 1fr 60px;}
    nav{padding:1rem;}
    main{padding:1rem;}
  }
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">WEEKLY <span>SCORECARD</span></div>
      <div class="page-sub" id="week-range-label">Loading...</div>
    </div>
    <div class="week-nav">
      <button onclick="changeWeek(-1)">‹ Prev</button>
      <span class="week-label" id="week-nav-label">This Week</span>
      <button onclick="changeWeek(1)">Next ›</button>
    </div>
  </div>

  <!-- PLAN INFO BAR -->
  <div class="plan-bar" id="plan-bar" style="display:none">
    <div style="display:flex;align-items:center;gap:0.625rem">
      <span class="plan-wk" id="plan-wk-label"></span>
      <span class="plan-phase-tag" id="plan-phase-tag"></span>
    </div>
    <span class="plan-key" id="plan-key-label"></span>
    <div style="text-align:right;white-space:nowrap">
      <div style="font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em">Plan Target</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.75rem;line-height:1;color:var(--accent)" id="plan-target-mi"></div>
      <div style="font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3)">miles this week</div>
    </div>
  </div>
  <div id="plan-bar-empty" style="display:none;margin-bottom:1.5rem;padding:0.75rem 1.25rem;background:var(--surface);border:1px solid var(--border);font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3)">Week outside training plan — no mileage target set.</div>

  <!-- LOADING -->
  <div id="sc-loading" class="loading"><div class="spinner"></div><span>Loading your Strava data...</span></div>

  <!-- SCORECARD CONTENT -->
  <div id="sc-content" style="display:none">

    <!-- HERO STATS -->
    <div class="score-hero" id="hero-stats"></div>

    <!-- DAY BY DAY + STREAK -->
    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Day by Day</span>
          <span class="panel-badge">Plan vs Actual</span>
        </div>
        <div id="day-table"></div>
      </div>

      <div>
        <div class="panel" style="margin-bottom:1.5rem">
          <div class="panel-header">
            <span class="panel-title">Activity Streak</span>
            <span class="panel-badge" id="streak-count">0 days</span>
          </div>
          <div id="streak-dots" class="streak-dots"></div>
          <div style="margin-top:0.75rem;font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3)">
            <span style="color:var(--accent)">■</span> Active &nbsp;
            <span style="color:var(--surface3)">■</span> Rest &nbsp;
            <span style="color:rgba(255,68,68,0.3)">■</span> Missed planned
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Heart Rate Zones</span>
            <span class="panel-badge">This week</span>
          </div>
          <div id="hr-zones"></div>
        </div>
      </div>
    </div>

    <!-- WEEKLY HISTORY CHART -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Mileage History</span>
        <span class="panel-badge">Last 8 weeks</span>
      </div>
      <div id="history-chart" style="height:150px;display:flex;align-items:flex-end;gap:6px;padding-top:8px"></div>
    </div>

  </div>
</main>

<script src="local-config.js" onerror="void 0"></script>
<script src="nav.js"></script>
<script>
let allActivities = [];
let weekOffset = 0;

// ── WEEK HELPERS ──────────────────────────────────────────
function getWeekBounds(offset = 0) {
  const now = new Date();
  const start = getWeekStart(now);
  start.setDate(start.getDate() + offset * 7);
  const end = new Date(start); end.setDate(end.getDate() + 6); end.setHours(23,59,59);
  return { start, end };
}

function activitiesInWeek(acts, start, end) {
  return acts.filter(a => {
    const d = new Date(a.start_date_local);
    return d >= start && d <= end;
  });
}

// ── LOAD DATA ─────────────────────────────────────────────
async function loadScorecard() {
  const token = localStorage.getItem('strava_access_token');
  if (!token) {
    document.getElementById('sc-loading').innerHTML = `<div class="empty-state">Connect Strava on the <a href="index.html" style="color:var(--accent)">Dashboard</a> to see your scorecard.</div>`;
    return;
  }

  try {
    allActivities = await fetchActivities(token, 100);
    renderScorecard();
    document.getElementById('sc-loading').style.display = 'none';
    document.getElementById('sc-content').style.display = 'block';
  } catch(e) {
    document.getElementById('sc-loading').innerHTML = `<span style="color:var(--red)">Error loading data: ${e.message}</span>`;
  }
}

function changeWeek(dir) {
  weekOffset += dir;
  renderScorecard();
}


// ── RENDER SCORECARD ──────────────────────────────────────
function renderScorecard() {
  const { start, end } = getWeekBounds(weekOffset);
  const planWeek = getPlanWeekForDate(start);
  const goal = planWeek ? planWeek.miles : getWeeklyGoal();
  const planned = getPlannedWorkouts();

  // Week label
  const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const isThisWeek = weekOffset === 0;
  document.getElementById('week-nav-label').textContent = isThisWeek ? 'This Week' : weekOffset < 0 ? `${Math.abs(weekOffset)}w ago` : `${weekOffset}w ahead`;
  document.getElementById('week-range-label').textContent = `${fmt(start)} – ${fmt(end)}`;

  // Plan info bar
  const planBar = document.getElementById('plan-bar');
  const planBarEmpty = document.getElementById('plan-bar-empty');
  if (planWeek) {
    planBar.style.display = 'flex';
    planBarEmpty.style.display = 'none';
    document.getElementById('plan-wk-label').textContent = `Week ${planWeek.weekNum}`;
    const tag = document.getElementById('plan-phase-tag');
    const phaseLabels = { base:'Base', build:'Build', peak:'Peak', 'race-specific':'Race-Specific', taper:'Taper', race:'Race Week' };
    tag.textContent = phaseLabels[planWeek.phase] || planWeek.phase;
    tag.className = `plan-phase-tag ${planWeek.phase}`;
    document.getElementById('plan-key-label').textContent = planWeek.key;
    document.getElementById('plan-target-mi').textContent = planWeek.miles;
  } else {
    planBar.style.display = 'none';
    planBarEmpty.style.display = 'block';
  }

  const weekActs = activitiesInWeek(allActivities, start, end);
  const runs = weekActs.filter(a => a.type === 'Run');
  const totalMi = weekActs.reduce((s, a) => s + metersToMiles(a.distance), 0);
  const totalElev = weekActs.reduce((s, a) => s + metersToFeet(a.total_elevation_gain || 0), 0);
  const avgPaceSecs = runs.length ? runs.reduce((s, a) => s + (a.moving_time / metersToMiles(a.distance)), 0) / runs.length : 0;
  const hasHR = weekActs.some(a => a.has_heartrate);

  // Progress color
  const pct = Math.min(totalMi / goal, 1);
  const color = pct >= 1 ? 'green' : pct >= 0.6 ? 'yellow' : 'red';
  const statusLabel = pct >= 1 ? (planWeek ? '✓ Plan Met' : '✓ Goal Met') : pct >= 0.6 ? 'On Track' : pct > 0 ? 'Behind Plan' : 'Not Started';

  // Hero stats
  const pm = Math.floor(avgPaceSecs/60), ps = Math.round(avgPaceSecs%60).toString().padStart(2,'0');
  document.getElementById('hero-stats').innerHTML = `
    ${heroBox('Miles Logged', totalMi.toFixed(1), `of ${goal} mi ${planWeek ? 'planned' : 'goal'}`, color, statusLabel, pct)}
    ${heroBox('Activities', weekActs.length, `${runs.length} run${runs.length!==1?'s':''}`, weekActs.length > 0 ? 'green' : 'neutral', weekActs.length > 0 ? 'Active' : 'No activity', weekActs.length / 7)}
    ${heroBox('Elevation', totalElev.toLocaleString(), 'feet gained', totalElev > 500 ? 'green' : 'neutral', totalElev > 0 ? 'Logged' : '—', Math.min(totalElev/2000, 1))}
    ${heroBox('Avg Pace', avgPaceSecs > 0 ? `${pm}:${ps}` : '—', 'per mile', 'neutral', runs.length > 0 ? 'Runs only' : 'No runs', 0)}`;

  renderDayTable(start, weekActs, planned);
  renderStreak();
  renderHRZones(weekActs, hasHR);
  renderHistoryChart();
}

function heroBox(label, value, sub, color, status, pct) {
  const barPct = Math.round(Math.min(pct, 1) * 100);
  return `<div class="score-box ${color}">
    <div class="sb-label">${label}</div>
    <div class="sb-value">${value}</div>
    <div class="sb-sub">${sub}</div>
    <div class="sb-status ${color}">${status}</div>
    <div class="progress-track"><div class="progress-fill ${color}" style="width:${barPct}%"></div></div>
  </div>`;
}

// ── DAY TABLE ─────────────────────────────────────────────
function renderDayTable(weekStart, weekActs, planned) {
  const days = Array.from({length:7}, (_, i) => {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    return d;
  });

  const actByDay = {};
  weekActs.forEach(a => {
    const key = isoDate(new Date(a.start_date_local));
    if (!actByDay[key]) actByDay[key] = [];
    actByDay[key].push(a);
  });

  const today = new Date(); today.setHours(0,0,0,0);

  const rows = days.map(d => {
    const key = isoDate(d);
    const acts = actByDay[key] || [];
    const plan = planned[key];
    const isPast = d < today;
    const isToday = d.getTime() === today.getTime();

    const actualMi = acts.reduce((s, a) => s + metersToMiles(a.distance), 0);
    const plannedMi = plan ? parseFloat(plan.dist || 0) : 0;
    const actType = acts[0]?.type || (plan?.type === 'Rest' ? 'Rest' : null);

    let statusCls = 'pending', statusTxt = isToday ? 'Today' : isPast ? '—' : 'Upcoming';
    if (acts.length > 0) {
      if (!plannedMi || actualMi >= plannedMi * 0.9) { statusCls = 'beat'; statusTxt = actualMi >= plannedMi * 1.05 ? '↑ Beat' : '✓ Done'; }
      else if (actualMi >= plannedMi * 0.7) { statusCls = 'close'; statusTxt = '~ Close'; }
      else { statusCls = 'miss'; statusTxt = '↓ Short'; }
    } else if (isPast && plan && plan.type !== 'Rest') {
      statusCls = 'miss'; statusTxt = 'Missed';
    } else if (plan?.type === 'Rest' || (!plan && isPast && acts.length === 0 && !isToday)) {
      statusCls = 'rest'; statusTxt = plan?.type === 'Rest' ? 'Rest' : '—';
    }

    const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
    const plannedStr = plan ? `${plan.type}${plannedMi ? ' '+plannedMi+'mi' : ''}` : '—';
    const actualStr = acts.length ? `${actType||'?'} ${actualMi.toFixed(1)}mi` : isPast ? '—' : '';

    return `<div class="day-row${isToday?' today-row':''}">
      <span class="dr-day">${dayLabel}</span>
      <span class="dr-type ${actType||'—'}">${actType||'—'}</span>
      <span class="dr-planned">${plannedStr}</span>
      <span class="dr-actual ${statusCls}">${actualStr}</span>
      <span class="dr-status ${statusCls}">${statusTxt}</span>
    </div>`;
  });

  document.getElementById('day-table').innerHTML = `
    <div class="day-row header">
      <span>Day</span><span>Type</span><span>Planned</span><span>Actual</span><span>Status</span>
    </div>` + rows.join('');
}

// ── STREAK ────────────────────────────────────────────────
function renderStreak() {
  const today = new Date(); today.setHours(0,0,0,0);
  const planned = getPlannedWorkouts();
  const actDates = new Set(allActivities.map(a => isoDate(new Date(a.start_date_local))));

  // Last 28 days
  const dots = Array.from({length:28}, (_, i) => {
    const d = new Date(today); d.setDate(d.getDate() - (27 - i));
    const key = isoDate(d);
    const hasAct = actDates.has(key);
    const hasPlan = planned[key] && planned[key].type !== 'Rest';
    const isPast = d <= today;
    let cls = 'rest';
    if (hasAct) cls = 'active';
    else if (isPast && hasPlan) cls = 'missed';
    return `<div class="streak-dot ${cls}" title="${key}"></div>`;
  }).join('');

  // Count current streak
  let streak = 0;
  for (let i = 0; i <= 60; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    if (actDates.has(isoDate(d))) streak++;
    else if (i > 0) break;
  }

  document.getElementById('streak-dots').innerHTML = dots;
  document.getElementById('streak-count').textContent = `${streak} day streak`;
}

// ── HR ZONES ──────────────────────────────────────────────
function renderHRZones(weekActs, hasHR) {
  const el = document.getElementById('hr-zones');
  if (!hasHR) {
    el.innerHTML = `<div class="hr-note">Heart rate data not available.<br>Enable HR sharing in your Strava app settings on Apple Watch to unlock zone tracking.</div>`;
    return;
  }

  // Zones based on ~180 max HR (will be personalized once we have data)
  const zones = [
    { name: 'Z1 Recovery', range: '<115', color: '#5ab0e8', min: 0, max: 115 },
    { name: 'Z2 Aerobic',  range: '115–138', color: '#c8b27a', min: 115, max: 138 },
    { name: 'Z3 Tempo',    range: '138–152', color: '#ffbb00', min: 138, max: 152 },
    { name: 'Z4 Threshold',range: '152–165', color: '#e8c868', min: 152, max: 165 },
    { name: 'Z5 Max',      range: '165+',   color: '#ff4444', min: 165, max: 999 },
  ];

  // Placeholder — shows "enable HR" note per zone since we don't have stream data yet
  el.innerHTML = zones.map(z => `
    <div class="hr-zone-row">
      <span class="hz-label" style="color:${z.color}">${z.name}</span>
      <span class="hz-range">${z.range} bpm</span>
      <div class="hz-bar-track"><div class="hz-bar" style="background:${z.color};width:0%"></div></div>
      <span class="hz-pct">—</span>
    </div>`).join('') + `<div class="hr-note" style="padding-top:0.75rem">Enable heart rate on Strava to see time in zones.</div>`;
}

// ── HISTORY CHART ─────────────────────────────────────────
function renderHistoryChart() {
  const today = new Date();
  const weeks = Array.from({length:8}, (_, i) => {
    const start = getWeekStart(today);
    start.setDate(start.getDate() - (7 - i) * 7);
    const end = new Date(start); end.setDate(end.getDate() + 6); end.setHours(23,59,59);
    const acts = activitiesInWeek(allActivities, start, end);
    const miles = acts.reduce((s, a) => s + metersToMiles(a.distance), 0);
    const planW = getPlanWeekForDate(start);
    const target = planW ? planW.miles : getWeeklyGoal();
    return { start, miles, target };
  });

  const maxMi = Math.max(...weeks.map(w => Math.max(w.miles, w.target)), 1);
  const chart = document.getElementById('history-chart');
  chart.innerHTML = weeks.map((w, i) => {
    const BAR_MAX_PCT = 72;
    const heightPct = maxMi > 0 && w.miles > 0 ? Math.max((w.miles / maxMi) * BAR_MAX_PCT, 3) : 0;
    const targetPct = maxMi > 0 ? (w.target / maxMi) * BAR_MAX_PCT : 0;
    const isCurrentWeek = i === 7 + weekOffset;
    const color = w.miles >= w.target ? 'var(--accent)' : w.miles >= w.target * 0.6 ? '#ffbb00' : w.miles > 0 ? 'var(--red)' : 'var(--surface3)';
    const textColor = isCurrentWeek ? 'var(--accent)' : color;
    const label = w.start.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%">
      <div style="flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative">
        <div style="font-family:'DM Mono',monospace;font-size:0.6rem;font-weight:500;color:${w.miles>0?textColor:'transparent'};text-align:center;margin-bottom:2px">${w.miles>0?w.miles.toFixed(1):''}</div>
        <div style="width:100%;background:${isCurrentWeek?'var(--accent)':color};height:${heightPct}%;position:relative">
          <div style="position:absolute;left:-1px;right:-1px;bottom:${heightPct>0?Math.min((targetPct/heightPct)*100,150):0}%;height:2px;background:rgba(200,178,122,0.6);display:${targetPct>0?'block':'none'}"></div>
        </div>
      </div>
      <div style="font-family:'DM Mono',monospace;font-size:0.55rem;color:${isCurrentWeek?'var(--accent)':'var(--text3)'};margin-top:3px">${label}</div>
      <div style="font-family:'DM Mono',monospace;font-size:0.5rem;color:var(--text3)">${w.target}mi</div>
    </div>`;
  }).join('');
}
