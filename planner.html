<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner · Sleddawg Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--surface:#111111;--surface2:#1a1a1a;--surface3:#222222;--border:#2a2a2a;--border2:#333333;--text:#f0ede8;--text2:#888880;--text3:#555550;--accent:#e8ff47;--accent2:#ff6b35;--accent3:#47e8c8;--red:#ff4444;--purple:#aa88ff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}
  body{min-height:100vh;}
  a{text-decoration:none;color:inherit;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:0.05em;}
  .logo span{color:var(--accent);}
  .nav-links{display:flex;gap:0;}
  .nav-link{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1rem;color:var(--text3);transition:color 0.15s;}
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--accent);}
  .connected-badge{display:flex;align-items:center;gap:0.5rem;font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--accent3);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  main{max-width:1300px;margin:0 auto;padding:2rem;}

  /* RACE BANNER */
  .race-banner{background:linear-gradient(135deg,#111 0%,#1a1a0a 100%);border:1px solid var(--accent);padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
  .rb-left h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:0.03em;}
  .rb-left h2 span{color:var(--accent);}
  .rb-left p{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3);margin-top:0.25rem;}
  .rb-stats{display:flex;gap:2rem;}
  .rb-stat .label{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);text-transform:uppercase;margin-bottom:0.2rem;}
  .rb-stat .value{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.4rem;color:var(--accent);}
  .rb-stat .value span{font-size:0.85rem;color:var(--text2);font-weight:400;}

  /* PHASE TABS */
  .phase-nav{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid var(--border);overflow-x:auto;}
  .phase-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.625rem 1.25rem;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;background:none;border-left:none;border-right:none;border-top:none;}
  .phase-tab:hover{color:var(--text);}
  .phase-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .phase-tab.current-phase{color:var(--accent3);}

  /* MACRO PLAN TABLE */
  .macro-table{width:100%;border-collapse:collapse;margin-bottom:1.5rem;}
  .macro-table th{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);text-align:left;background:var(--surface);}
  .macro-table td{padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);font-size:0.825rem;vertical-align:middle;}
  .macro-table tr:hover td{background:var(--surface2);}
  .macro-table tr.current-week td{background:rgba(232,255,71,0.04);border-left:2px solid var(--accent);}
  .macro-table tr.past-week td{opacity:0.5;}
  .week-num{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3);white-space:nowrap;}
  .week-dates{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);}
  .phase-badge{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;padding:0.15rem 0.5rem;white-space:nowrap;}
  .phase-badge.base{background:rgba(71,232,200,0.15);color:var(--accent3);}
  .phase-badge.build{background:rgba(255,107,53,0.15);color:var(--accent2);}
  .phase-badge.peak{background:rgba(232,255,71,0.15);color:var(--accent);}
  .phase-badge.race-specific{background:rgba(170,136,255,0.15);color:var(--purple);}
  .phase-badge.taper{background:rgba(255,68,68,0.15);color:var(--red);}
  .phase-badge.race{background:var(--accent);color:var(--bg);}
  .week-miles{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;}
  .week-miles.base{color:var(--accent3);}
  .week-miles.build{color:var(--accent2);}
  .week-miles.peak{color:var(--accent);}
  .week-miles.taper{color:var(--text2);}
  .week-key{font-size:0.775rem;color:var(--text2);}
  .week-key strong{color:var(--text);}
  .workout-pills{display:flex;gap:4px;flex-wrap:wrap;}
  .pill{font-family:'DM Mono',monospace;font-size:0.6rem;padding:0.15rem 0.4rem;border-radius:2px;}
  .pill.lsd{background:rgba(232,255,71,0.12);color:var(--accent);}
  .pill.b2b{background:rgba(255,107,53,0.15);color:var(--accent2);}
  .pill.tempo{background:rgba(170,136,255,0.15);color:var(--purple);}
  .pill.easy{background:rgba(71,232,200,0.1);color:var(--accent3);}
  .pill.rest{background:rgba(85,85,80,0.3);color:var(--text3);}
  .pill.race-sim{background:rgba(232,255,71,0.25);color:var(--accent);}
  .pill.night{background:rgba(100,100,200,0.2);color:#aaaaff;}
  .mileage-bar-cell{width:120px;}
  .mileage-bar{height:4px;background:var(--surface3);margin-top:4px;}
  .mileage-fill{height:100%;transition:width 0.3s;}
  .actual-badge{font-family:'DM Mono',monospace;font-size:0.65rem;padding:0.15rem 0.4rem;}
  .actual-badge.done{background:rgba(71,232,200,0.15);color:var(--accent3);}
  .actual-badge.partial{background:rgba(255,107,53,0.15);color:var(--accent2);}
  .actual-badge.upcoming{color:var(--text3);}
  .view-btn{background:none;border:1px solid var(--border2);color:var(--text3);cursor:pointer;padding:0.2rem 0.5rem;font-family:'DM Mono',monospace;font-size:0.65rem;transition:all 0.15s;white-space:nowrap;}
  .view-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* WEEK DETAIL VIEW */
  .week-detail{display:none;background:var(--surface);border:1px solid var(--accent);padding:1.5rem;margin-bottom:1.5rem;}
  .week-detail.open{display:block;}
  .wd-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
  .wd-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;}
  .wd-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.25rem;}
  .day-cards{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .day-card{background:var(--surface2);border:1px solid var(--border);padding:0.875rem 0.625rem;display:flex;flex-direction:column;gap:0.5rem;cursor:pointer;transition:border-color 0.15s;min-height:160px;}
  .day-card:hover{border-color:var(--border2);}
  .day-card.has-workout{border-color:rgba(71,232,200,0.4);}
  .day-card.today-card{border-color:var(--accent);}
  .dc-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.7rem;text-transform:uppercase;color:var(--text2);}
  .dc-date{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);}
  .dc-weather{font-size:1.1rem;line-height:1;}
  .dc-temp{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text2);}
  .dc-score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.6rem;text-transform:uppercase;padding:0.1rem 0.35rem;}
  .dc-score.great{background:rgba(232,255,71,0.15);color:var(--accent);}
  .dc-score.good{background:rgba(71,232,200,0.15);color:var(--accent3);}
  .dc-score.fair{background:rgba(255,107,53,0.15);color:var(--accent2);}
  .dc-score.poor{background:rgba(255,68,68,0.15);color:var(--red);}
  .dc-planned{font-size:0.75rem;font-weight:500;margin-top:auto;}
  .dc-planned-type{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.65rem;text-transform:uppercase;}
  .dc-planned-type.LSD{color:var(--accent);}
  .dc-planned-type.B2B{color:var(--accent2);}
  .dc-planned-type.Easy{color:var(--accent3);}
  .dc-planned-type.Tempo{color:var(--purple);}
  .dc-planned-type.Rest{color:var(--text3);}
  .dc-planned-type.Race-Sim{color:var(--accent);}
  .dc-planned-type.Night{color:#aaaaff;}
  .dc-dist{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text2);}
  .dc-actual{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--accent3);margin-top:2px;}
  .dc-add{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);margin-top:auto;text-align:center;}

  /* WORKOUT FORM */
  .workout-form{background:var(--surface2);border:1px solid var(--accent);padding:1.25rem;margin-bottom:1.5rem;display:none;}
  .workout-form.open{display:block;}
  .form-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;margin-bottom:0.875rem;}
  .form-field label{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);text-transform:uppercase;display:block;margin-bottom:0.35rem;}
  .form-field input,.form-field select,.form-field textarea{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:0.5rem 0.625rem;font-family:'DM Mono',monospace;font-size:0.75rem;width:100%;outline:none;}
  .form-field input:focus,.form-field select:focus{border-color:var(--accent);}
  .form-field select option{background:var(--surface3);}
  .form-field textarea{resize:vertical;min-height:60px;}
  .form-actions{display:flex;gap:0.75rem;align-items:center;}
  .btn-primary{background:var(--accent);color:var(--bg);border:none;cursor:pointer;padding:0.5rem 1.25rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.08em;transition:opacity 0.15s;}
  .btn-primary:hover{opacity:0.85;}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text3);cursor:pointer;padding:0.5rem 1.25rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;transition:all 0.15s;}
  .btn-ghost:hover{border-color:var(--text);color:var(--text);}
  .btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);cursor:pointer;padding:0.5rem 1.25rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;margin-left:auto;}

  /* PANEL */
  .panel{background:var(--surface);border:1px solid var(--border);padding:1.25rem;margin-bottom:1.5rem;}
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border);}
  .panel-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text2);}
  .panel-badge{font-family:'DM Mono',monospace;font-size:0.65rem;background:var(--surface3);color:var(--text3);padding:0.2rem 0.5rem;}

  .loading{display:flex;align-items:center;gap:0.5rem;font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--text3);padding:0.5rem 0;}
  .spinner{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* TIPS */
  .tips-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
  .tip-card{background:var(--surface2);border:1px solid var(--border);padding:1rem;}
  .tip-icon{font-size:1.25rem;margin-bottom:0.5rem;}
  .tip-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.35rem;}
  .tip-body{font-size:0.8rem;color:var(--text2);line-height:1.6;}

  /* BASE PHASE RECAP */
  .recap-row{display:grid;grid-template-columns:70px 130px 70px 1fr 80px;gap:0.75rem;align-items:center;padding:0.625rem 0;border-bottom:1px solid var(--border);}
  .recap-row:last-child{border-bottom:none;}
  .recap-row.current-week-row{background:rgba(232,255,71,0.03);margin:0 -1.25rem;padding-left:1.25rem;padding-right:1.25rem;}
  .recap-bar-track{height:6px;background:var(--surface3);}
  .recap-bar-fill{height:100%;transition:width 0.6s ease;}
  .recap-miles{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.1rem;}
  .recap-target{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);}
  .recap-status{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;}
  .recap-status.green{color:var(--accent);}
  .recap-status.yellow{color:#ffbb00;}
  .recap-status.red{color:var(--red);}
  .recap-status.neutral{color:var(--text3);}

  @media(max-width:900px){
    .day-cards{grid-template-columns:repeat(4,1fr);}
    .form-grid{grid-template-columns:1fr 1fr;}
    .tips-grid{grid-template-columns:1fr;}
    .rb-stats{flex-wrap:wrap;gap:1rem;}
    nav{padding:1rem;}
    main{padding:1rem;}
    .recap-row{grid-template-columns:50px 1fr 60px 60px;}
  }
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main>
  <!-- PHASE TABS -->
  <div class="phase-nav" id="phase-nav"></div>

  <!-- MACRO PLAN TABLE -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">19-Week Training Plan</span>
      <div style="display:flex;gap:0.75rem;align-items:center">
        <span class="panel-badge">Race: Oct 24, 2026</span>
        <button class="btn-ghost" style="padding:0.35rem 0.875rem;font-size:0.75rem" onclick="lockAllWeeks()" id="lock-all-btn">⬇ Lock Full Plan</button>
<button class="btn-primary" style="padding:0.35rem 0.875rem;font-size:0.75rem" onclick="generateWeekWithAI()">✦ AI Tune This Week</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="macro-table" id="macro-table">
        <thead>
          <tr>
            <th>Week</th>
            <th>Dates</th>
            <th>Phase</th>
            <th>Target Miles</th>
            <th>Key Workouts</th>
            <th>Focus</th>
            <th>Actual</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="macro-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- BASE PHASE RECAP -->
  <div class="panel" id="base-recap-panel" style="display:none;margin-bottom:1.5rem">
    <div class="panel-header">
      <span class="panel-title">Base Phase · Plan vs Strava</span>
      <span class="panel-badge">Weeks 1–6 · Jun 7 – Jul 18</span>
    </div>
    <div style="display:grid;grid-template-columns:70px 130px 70px 1fr 80px;gap:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em">
      <span>Week</span><span>Dates</span><span>Phase</span><span>Miles</span><span>Status</span>
    </div>
    <div id="base-recap"></div>
    <div id="base-recap-summary" style="margin-top:0.875rem;padding-top:0.875rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:1rem;flex-wrap:wrap"></div>
  </div>

  <!-- WEEK DETAIL (expands inline) -->
  <div class="week-detail" id="week-detail">
    <div class="wd-header">
      <div class="wd-title" id="wd-title">Week Detail</div>
      <div style="display:flex;gap:0.75rem;align-items:center">
        <button class="btn-ghost" style="padding:0.3rem 0.875rem;font-size:0.75rem" onclick="lockThisWeek()" id="lock-week-btn">⬇ Lock This Week</button>
        <button class="wd-close" onclick="closeWeekDetail()">×</button>
      </div>
    </div>
    <div id="weather-loading-wd" class="loading" style="display:none"><div class="spinner"></div><span>Loading weather...</span></div>
    <div class="day-cards" id="day-cards"></div>
  </div>

  <!-- WORKOUT FORM -->
  <div class="workout-form" id="workout-form">
    <div class="form-title" id="form-title">Edit Workout</div>
    <div class="form-grid">
      <div class="form-field">
        <label>Date</label>
        <input type="date" id="f-date"/>
      </div>
      <div class="form-field">
        <label>Planned Window</label>
        <input type="text" id="f-time" placeholder="e.g. 5:00am or 7:30pm"/>
      </div>
      <div class="form-field">
        <label>Workout Type</label>
        <select id="f-type">
          <option value="Easy">Easy Run</option>
          <option value="LSD">Long Slow Distance</option>
          <option value="B2B">Back-to-Back Long</option>
          <option value="Tempo">Tempo Run</option>
          <option value="Race-Sim">Race Simulation</option>
          <option value="Night">Night Run</option>
          <option value="Walk">Walk/Hike</option>
          <option value="Strength">Strength</option>
          <option value="Rest">Rest Day</option>
        </select>
      </div>
      <div class="form-field">
        <label>Target Distance (mi)</label>
        <input type="number" id="f-dist" placeholder="0" step="0.5" min="0"/>
      </div>
      <div class="form-field">
        <label>Target Pace (/mi)</label>
        <input type="text" id="f-pace" placeholder="e.g. 10:30 or 3h"/>
      </div>
      <div class="form-field" style="grid-column:span 3">
        <label>Workout Name</label>
        <input type="text" id="f-name" placeholder="e.g. Friday long run"/>
      </div>
      <div class="form-field" style="grid-column:span 4">
        <label>Notes / Instructions</label>
        <textarea id="f-notes" placeholder="Effort level, route, nutrition reminders..."></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveWorkout()">Save</button>
      <button class="btn-ghost" onclick="closeForm()">Cancel</button>
      <button class="btn-danger" id="delete-btn" onclick="deleteWorkout()" style="display:none">Delete</button>
    </div>
  </div>

</main>

<script src="local-config.js" onerror="void 0"></script>
<script src="nav.js"></script>
<script>

  {phase:'base', miles:43, key:'Recovery week', workouts:{

  // BUILD PHASE (Wk 7-8, Jul 19 – Aug 1)

const PHASES = {
  base: { label: 'Base', color: 'var(--accent3)', cls: 'base' },
  build: { label: 'Build', color: 'var(--accent2)', cls: 'build' },
  peak: { label: 'Peak', color: 'var(--accent)', cls: 'peak' },
  'race-specific': { label: 'Race-Specific', color: 'var(--purple)', cls: 'race-specific' },
  taper: { label: 'Taper', color: 'var(--red)', cls: 'taper' },
  race: { label: 'Race Week', color: 'var(--accent)', cls: 'race' },
};

// Week 1 = Jun 7 2026
const PLAN_START = new Date('2026-06-07T00:00:00');

function getWeekStart(weekIdx) {
  const d = new Date(PLAN_START);
  d.setDate(d.getDate() + weekIdx * 7);
  return d;
}
function getWeekEnd(weekIdx) {
  const d = getWeekStart(weekIdx);
  d.setDate(d.getDate() + 6);
  return d;
}
function isoDate(d) { return d.toISOString().split('T')[0]; }
function fmtShort(d) { return d.toLocaleDateString('en-US', {month:'short',day:'numeric'}); }

function currentWeekIdx() {
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((today - PLAN_START) / (7*24*3600*1000));
  return Math.max(0, Math.min(diff, PLAN.length - 1));
}

// ── PHASE TABS ────────────────────────────────────────────
function renderPhaseTabs() {
  const phases = ['all','base','build','peak','race-specific','taper','race'];
  const curIdx = currentWeekIdx();
  const curPhase = PLAN[curIdx]?.phase;
  document.getElementById('phase-nav').innerHTML = phases.map(p => {
    const isCur = p === curPhase;
    const label = p === 'all' ? 'All Weeks' : PHASES[p]?.label || p;
    return `<button class="phase-tab${p==='all'?' active':''}${isCur?' current-phase':''}" onclick="filterPhase('${p}',this)">${label}${isCur&&p!=='all'?' ◆':''}</button>`;
  }).join('');
}

function filterPhase(phase, el) {
  document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.macro-table tbody tr').forEach(tr => {
    tr.style.display = (phase === 'all' || tr.dataset.phase === phase) ? '' : 'none';
  });
}

// ── MACRO TABLE ───────────────────────────────────────────
function renderMacroTable() {
  const today = new Date(); today.setHours(0,0,0,0);
  const curIdx = currentWeekIdx();
  const planned = getPlannedWorkouts();
  const maxMiles = Math.max(...PLAN.map(w => w.miles));

  document.getElementById('macro-tbody').innerHTML = PLAN.map((week, i) => {
    const wStart = getWeekStart(i);
    const wEnd = getWeekEnd(i);
    const isCurrent = i === curIdx;
    const isPast = wEnd < today;
    const ph = PHASES[week.phase];

    // Actual miles from planned workouts this week
    const actualMilesPlanned = Object.values(planned)
      .filter(w => { const d = new Date(w.date); return d >= wStart && d <= wEnd; })
      .reduce((s, w) => s + parseFloat(w.dist || 0), 0);

    const barPct = Math.round((week.miles / maxMiles) * 100);
    const barColor = ph.color;

    // Actual from Strava — will fill in via JS after load
    const actualId = `actual-${i}`;

    // Key workout pills (exclude 'focus' key)
    const pillMap = { LSD:'lsd', B2B:'b2b', Tempo:'tempo', Easy:'easy', Rest:'rest', 'Race-Sim':'race-sim', Night:'night' };
    const pills = Object.entries(week.workouts)
      .filter(([k, v]) => k !== 'focus' && v !== 'Rest' && v !== 'rest')
      .map(([, v]) => {
        const type = Object.keys(pillMap).find(k => v.toLowerCase().includes(k.toLowerCase())) || 'easy';
        return `<span class="pill ${pillMap[type]||'easy'}">${v}</span>`;
      }).slice(0,5).join('');

    return `<tr data-phase="${week.phase}" class="${isCurrent?'current-week':isPast?'past-week':''}">
      <td><span class="week-num">W${i+1}${isCurrent?' ◆':''}</span></td>
      <td><span class="week-dates">${fmtShort(wStart)}–${fmtShort(wEnd)}</span></td>
      <td><span class="phase-badge ${ph.cls}">${ph.label}</span></td>
      <td>
        <span class="week-miles ${week.phase==='taper'?'taper':week.phase==='base'?'base':week.phase==='build'?'build':'peak'}">${week.miles}</span>
        <div class="mileage-bar"><div class="mileage-fill" style="width:${barPct}%;background:${barColor}"></div></div>
      </td>
      <td><div class="workout-pills">${pills}</div></td>
      <td><span class="week-key">${week.workouts.focus.split('.')[0]}.</span></td>
      <td><span class="actual-badge upcoming" id="${actualId}">—</span></td>
      <td><button class="view-btn" onclick="openWeekDetail(${i})">View Week →</button></td>
    </tr>`;
  }).join('');
}

// ── FILL ACTUAL MILES FROM STRAVA ─────────────────────────
function fillActualMiles(activities) {
  PLAN.forEach((week, i) => {
    const wStart = getWeekStart(i);
    const wEnd = getWeekEnd(i);
    wEnd.setHours(23,59,59);
    const acts = activities.filter(a => {
      const d = new Date(a.start_date_local);
      return d >= wStart && d <= wEnd;
    });
    const miles = acts.reduce((s, a) => s + metersToMiles(a.distance), 0);
    const el = document.getElementById(`actual-${i}`);
    if (!el) return;
    if (miles > 0) {
      const pct = miles / week.miles;
      el.textContent = miles.toFixed(1) + ' mi';
      el.className = `actual-badge ${pct >= 0.9 ? 'done' : 'partial'}`;
    }
  });
  renderBaseRecap(activities);
}

// ── BASE PHASE RECAP ──────────────────────────────────────
function renderBaseRecap(activities) {
  const today = new Date(); today.setHours(0,0,0,0);
  const baseWeeks = PLAN.map((w, i) => ({...w, idx: i})).filter(w => w.phase === 'base');

  let totalActual = 0;
  const totalTarget = baseWeeks.reduce((s, w) => s + w.miles, 0);

  const rows = baseWeeks.map(week => {
    const wStart = getWeekStart(week.idx);
    const wEnd = getWeekEnd(week.idx);
    const wEndFull = new Date(wEnd); wEndFull.setHours(23,59,59);

    const weekActs = activities.filter(a => {
      const d = new Date(a.start_date_local);
      return d >= wStart && d <= wEndFull;
    });
    const actual = weekActs.reduce((s, a) => s + metersToMiles(a.distance), 0);
    const isPast = wEndFull < today;
    const isCurrent = wStart <= today && today <= wEndFull;
    const pct = actual / week.miles;
    const barPct = Math.min(pct * 100, 100);
    totalActual += actual;

    const barColor = pct >= 1 ? 'var(--accent)' : pct >= 0.7 ? '#ffbb00' : pct > 0.1 ? 'var(--accent2)' : 'var(--surface3)';
    let statusTxt, statusCls;
    if (isCurrent) { statusTxt = 'In Progress'; statusCls = 'yellow'; }
    else if (!isPast) { statusTxt = 'Upcoming'; statusCls = 'neutral'; }
    else if (pct >= 0.9) { statusTxt = '✓ Done'; statusCls = 'green'; }
    else if (pct >= 0.6) { statusTxt = '~ Partial'; statusCls = 'yellow'; }
    else if (actual > 0) { statusTxt = '↓ Short'; statusCls = 'red'; }
    else { statusTxt = 'No data'; statusCls = 'red'; }

    const runs = weekActs.filter(a => a.type === 'Run');
    const actCount = weekActs.length;

    return `<div class="recap-row${isCurrent ? ' current-week-row' : ''}">
      <span class="week-num">W${week.idx+1}${isCurrent?' ◆':''}</span>
      <span class="week-dates">${fmtShort(wStart)}–${fmtShort(wEnd)}</span>
      <span class="phase-badge base">Base</span>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <span class="recap-miles" style="color:${barColor}">${actual > 0 ? actual.toFixed(1) : '—'}</span>
          <span class="recap-target">of ${week.miles} mi · ${actCount} activit${actCount===1?'y':'ies'}</span>
        </div>
        <div class="recap-bar-track"><div class="recap-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
        <div style="font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);margin-top:3px">${week.workouts.focus.split('.')[0]}</div>
      </div>
      <span class="recap-status ${statusCls}">${statusTxt}</span>
    </div>`;
  });

  const totalPct = totalTarget > 0 ? totalActual / totalTarget : 0;
  const totalBarPct = Math.min(totalPct * 100, 100);
  const totalColor = totalPct >= 1 ? 'var(--accent)' : totalPct >= 0.5 ? '#ffbb00' : totalPct > 0 ? 'var(--accent2)' : 'var(--text3)';
  const weeksComplete = baseWeeks.filter((w, i) => {
    const wEnd = getWeekEnd(w.idx); wEnd.setHours(23,59,59);
    return wEnd < today;
  }).length;

  document.getElementById('base-recap').innerHTML = rows.join('');
  document.getElementById('base-recap-summary').innerHTML = `
    <span style="font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em">Base Total</span>
    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;color:${totalColor}">${totalActual.toFixed(1)}</span>
    <span style="font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3)">/ ${totalTarget} mi &nbsp;·&nbsp; ${weeksComplete}/${baseWeeks.length} weeks done</span>
    <div style="flex:1;min-width:80px;height:4px;background:var(--surface3)"><div style="height:100%;width:${totalBarPct}%;background:${totalColor};transition:width 0.6s"></div></div>
    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;color:${totalColor}">${Math.round(totalPct*100)}%</span>`;
  document.getElementById('base-recap-panel').style.display = 'block';
}

function renderDayCards(weekIdx, showWeather) {
  const week = PLAN[weekIdx];
  const wStart = getWeekStart(weekIdx);
  const planned = getPlannedWorkouts();
  const today = new Date(); today.setHours(0,0,0,0);
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  document.getElementById('day-cards').innerHTML = DAYS.map((dayName, di) => {
    const d = new Date(wStart); d.setDate(d.getDate() + di);
    const dateStr = isoDate(d);
    const isToday = d.getTime() === today.getTime();
    const plannedWorkout = planned[dateStr];
    const defaultWorkout = week.workouts[dayName];

    // Weather
    let weatherHtml = '';
    if (showWeather && weatherData.time) {
      const wi = weatherData.time.indexOf(dateStr);
      if (wi >= 0) {
        const tmax = Math.round(weatherData.temperature_2m_max[wi]);
        const tmin = Math.round(weatherData.temperature_2m_min[wi]);
        const precip = weatherData.precipitation_sum[wi] || 0;
        const wind = Math.round(weatherData.wind_speed_10m_max[wi]);
        const code = weatherData.weathercode[wi];
        const score = runScore(tmax, tmin, precip*25.4, wind*1.6);
        weatherHtml = `<div class="dc-weather">${weatherIcon(code)}</div>
          <div class="dc-temp">${tmax}°/${tmin}°F · ${wind}mph</div>
          <div class="dc-score ${score.cls}">${score.label}</div>`;
      }
    }

    // Workout display
    let workoutHtml = '';
    const wo = plannedWorkout || (defaultWorkout ? {type: defaultWorkout.split(' ')[0], name: defaultWorkout, dist: defaultWorkout.match(/(\d+)/)?.[1] || ''} : null);
    if (wo) {
      workoutHtml = `<div class="dc-planned">
        <div class="dc-planned-type ${wo.type}">${wo.type}</div>
        <div class="dc-dist">${wo.dist ? wo.dist+' mi' : ''} ${wo.name && wo.name !== wo.type ? wo.name : ''}</div>
        ${wo.time ? `<div style="font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--accent);margin-top:2px">${wo.time}</div>` : ''}
      </div>`;
    }

    return `<div class="day-card${wo && wo.type !== 'Rest' ? ' has-workout':''} ${isToday?'today-card':''}" onclick="openForm('${dateStr}')">
      <div class="dc-label">${dayName}</div>
      <div class="dc-date">${fmtShort(d)}</div>
      ${weatherHtml}
      ${workoutHtml || '<div class="dc-add" style="margin-top:auto">+ Add</div>'}
    </div>`;
  }).join('');
}

// ── WEATHER ───────────────────────────────────────────────
function weatherIcon(code){if(code===0)return'☀️';if(code<=2)return'⛅';if(code===3)return'☁️';if(code<=49)return'🌫️';if(code<=59)return'🌦️';if(code<=67)return'🌧️';if(code<=77)return'❄️';if(code<=82)return'🌧️';if(code<=99)return'⛈️';return'🌡️';}
function runScore(tmax,tmin,precip,wind){const temp=(tmax+tmin)/2;let s=100;if(temp<0||temp>35)s-=40;else if(temp<5||temp>30)s-=20;else if(temp>=10&&temp<=22)s+=10;if(precip>10)s-=30;else if(precip>3)s-=15;else if(precip>0.5)s-=5;if(wind>40)s-=20;else if(wind>25)s-=10;if(s>=85)return{label:'Great',cls:'great'};if(s>=65)return{label:'Good',cls:'good'};if(s>=45)return{label:'Fair',cls:'fair'};return{label:'Poor',cls:'poor'};}

async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,weathercode&hourly=temperature_2m,relativehumidity_2m,precipitation_probability,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FNew_York&forecast_days=7`;
    const resp = await fetch(url);
    const json = await resp.json();
    weatherData = json.daily;
    weatherHourly = json.hourly;
  } catch(e) { console.warn('Weather load failed', e); }
}

function buildWindowSummary(wStart) {
  if (!weatherHourly) return 'No hourly weather data.';
  const DNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return Array.from({length:7}, (_, di) => {
    const d = new Date(wStart); d.setDate(d.getDate() + di);
    const dateStr = isoDate(d);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const getWindow = (hours) => {
      const entries = hours.map(h => {
        const t = `${dateStr}T${String(h).padStart(2,'0')}:00`;
        const idx = weatherHourly.time.indexOf(t);
        if (idx < 0) return null;
        return {
          temp: Math.round(weatherHourly.temperature_2m[idx]),
          humidity: Math.round(weatherHourly.relativehumidity_2m[idx]),
          precip: Math.round(weatherHourly.precipitation_probability[idx]),
          wind: Math.round(weatherHourly.wind_speed_10m[idx])
        };
      }).filter(Boolean);
      if (!entries.length) return null;
      return {
        temp: Math.round(entries.reduce((s,e)=>s+e.temp,0)/entries.length),
        humidity: Math.round(entries.reduce((s,e)=>s+e.humidity,0)/entries.length),
        precip: Math.max(...entries.map(e=>e.precip)),
        wind: Math.round(entries.reduce((s,e)=>s+e.wind,0)/entries.length)
      };
    };
    const morning = getWindow([3,4,5]);
    const evening = !isWeekend ? getWindow([19,20]) : null;
    const fmt = (w, label) => w ? `${label}: ${w.temp}°F ${w.humidity}%RH rain${w.precip}% wind${w.wind}mph` : '';
    const windows = [fmt(morning,'3am start'), isWeekend ? '(weekend: AM only)' : fmt(evening,'7pm start')].filter(Boolean);
    return `${DNAMES[d.getDay()]} ${dateStr}: ${windows.join(' | ')}`;
  }).join('\n');
}

// ── AI TUNE THIS WEEK ─────────────────────────────────────
async function generateWeekWithAI() {
  const curIdx = currentWeekIdx();
  const week = PLAN[curIdx];
  const token = localStorage.getItem('strava_access_token');
  let recentStr = 'No Strava data.';
  if (token) {
    try {
      const acts = await fetchActivities(token, 10);
      recentStr = acts.slice(0,5).map(a => `${a.start_date_local.split('T')[0]}: ${metersToMiles(a.distance).toFixed(1)}mi`).join(', ');
    } catch(e){}
  }

  const wStart = getWeekStart(curIdx);

  // Fetch hourly weather if not already loaded
  if (!weatherHourly) await loadWeather();
  const windowSummary = buildWindowSummary(wStart);

  const btn = document.querySelector('.btn-primary[onclick="generateWeekWithAI()"]');
  btn.disabled = true; btn.textContent = 'Generating...';

  try {
    const resp = await fetch('https://aged-silence-bd89.samuelwdonovan.workers.dev/', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:1000,
        system:`You are an ultra marathon coach scheduling a training week around weather and the athlete's lifestyle. You output ONLY raw JSON with no commentary, explanation, or markdown.

SCHEDULING RULES (non-negotiable):
- Weekdays (Mon–Fri): runs may START in the early morning window (3–6am) OR the evening window (starting at 7pm). Pick whichever is cooler, lower humidity, and rain-free at the start time — runs will extend well beyond these windows and that is expected.
- Weekends (Sat–Sun): early morning start ONLY (3–6am). No evening runs on weekends.
- Long runs and back-to-back stacks should be placed on weekdays whenever possible. Reserve weekend slots for runs that can't fit the weekday schedule.
- Evening starts on long runs are fine — the athlete is comfortable running through the night and finishing at 3am or later.
- Assign the hardest/longest run to the single best weather window of the week, regardless of whether that's a morning or evening start.
- Never schedule more than one run on the same day.
- Skip rest days — do not include them in the output.`,
        messages:[
          {role:'user',content:`Training for Greensprings 24 (100 miles, Oct 24 2026, flat 2.215mi loops).
Week ${curIdx+1} of ${PLAN.length} · Phase: ${week.phase} · Target: ${week.miles} miles
Runs this week: ${week.workouts.focus}
Key workouts: ${Object.entries(week.workouts).filter(([k,v])=>k!=='focus'&&v!=='Rest').map(([k,v])=>v).join(', ')}
Recent Strava: ${recentStr}

Weather windows (pick the best for each run):
${windowSummary}

Assign each run to a specific day and time window. Output JSON only — no explanation before or after:
{"workouts":[{"date":"YYYY-MM-DD","time":"H:MMam","type":"Easy|LSD|B2B|Tempo|Race-Sim|Night","name":"short name","dist":"X","pace":"M:SS","notes":"1-sentence coaching note"}]}`},
          {role:'assistant',content:'{"workouts":['}
        ]
      })
    });
    const data = await resp.json();
    // Reassemble prefilled response: Claude continues from '{"workouts":['
    const rawText = '{"workouts":[' + data.content[0].text;
    let plan;
    try {
      plan = JSON.parse(rawText.replace(/```json|```/g,'').trim());
    } catch(_) {
      // Fallback: find JSON object anywhere in the raw response
      const match = data.content[0].text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('No valid schedule returned');
      plan = JSON.parse(match[0]);
    }
    const planned = getPlannedWorkouts();
    plan.workouts.forEach(w => { planned[w.date] = {...w}; });
    savePlannedWorkouts(planned);
    if (openWeekIdx !== null) renderDayCards(openWeekIdx, weatherData.time?.length > 0);
    else openWeekDetail(curIdx);
  } catch(e) { alert('AI failed: ' + e.message); }

  btn.disabled = false; btn.textContent = '✦ AI Tune This Week';
}

// ── LOCK WEEK DEFAULTS ────────────────────────────────────
function defaultWorkoutsForWeek(weekIdx) {
  const week = PLAN[weekIdx];
  const wStart = getWeekStart(weekIdx);
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const planned = getPlannedWorkouts();
  DAYS.forEach((dayName, di) => {
    const d = new Date(wStart); d.setDate(d.getDate() + di);
    const dateStr = isoDate(d);
    if (planned[dateStr]) return; // don't overwrite manual entries
    const raw = week.workouts[dayName];
    if (!raw || raw === 'Rest') return; // skip rest days
    const typeMatch = raw.match(/^(Easy|LSD|B2B|Tempo|Race-Sim|Night|Walk|Strength)/);
    const distMatch = raw.match(/(\d+(?:\.\d+)?)\s*miles?/i) || raw.match(/\s(\d+)$/);
    planned[dateStr] = {
      type: typeMatch ? typeMatch[1] : 'Easy',
      name: raw,
      dist: distMatch ? distMatch[1] : '',
      pace: '',
      notes: week.workouts.focus,
      date: dateStr
    };
  });
  savePlannedWorkouts(planned);
}

function lockThisWeek() {
  if (openWeekIdx === null) return;
  defaultWorkoutsForWeek(openWeekIdx);
  renderDayCards(openWeekIdx, weatherData.time?.length > 0);
  const btn = document.getElementById('lock-week-btn');
  btn.textContent = '✓ Locked'; btn.style.color = 'var(--accent3)';
  setTimeout(() => { btn.textContent = '⬇ Lock This Week'; btn.style.color = ''; }, 2000);
}

function lockAllWeeks() {
  const btn = document.getElementById('lock-all-btn');
  btn.disabled = true; btn.textContent = 'Locking...';
  PLAN.forEach((_, i) => defaultWorkoutsForWeek(i));
  renderMacroTable();
  btn.disabled = false; btn.textContent = '✓ All 20 Weeks Locked';
  btn.style.color = 'var(--accent3)'; btn.style.borderColor = 'var(--accent3)';
  setTimeout(() => {
    btn.textContent = '⬇ Lock Full Plan';
    btn.style.color = ''; btn.style.borderColor = '';
  }, 3000);
}

// ── INIT ──────────────────────────────────────────────────
// ── PLAN VERSION GUARD ───────────────────────────────────
// When the plan changes, clear stale saved workouts so old dates don't bleed into new weeks
const PLAN_VERSION = '2026-06-07-v1';
if (localStorage.getItem('plan_version') !== PLAN_VERSION) {
  localStorage.removeItem('planned_workouts');
  localStorage.setItem('plan_version', PLAN_VERSION);
}

renderNav('planner');
renderPhaseTabs();
renderMacroTable();

// Load Strava actuals
const token = localStorage.getItem('strava_access_token');
if (token) {
  fetchActivities(token, 100).then(acts => fillActualMiles(acts)).catch(()=>{});
}

// Auto-lock current week if it has no planned workouts yet
const curIdx = currentWeekIdx();
const curStart = getWeekStart(curIdx);
const existingThisWeek = Object.keys(getPlannedWorkouts()).some(k => {
  const d = new Date(k); const e = getWeekEnd(curIdx); e.setHours(23,59,59);
  return d >= curStart && d <= e;
});
if (!existingThisWeek) defaultWorkoutsForWeek(curIdx);
</script>
</body>
