<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim · Sleddawg Fitness</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1224;--surface:#0f1a30;--surface2:#142035;--surface3:#1a2840;--border:#1e2e4e;--border2:#263654;--text:#f0ede8;--text2:#8896ac;--text3:#4a5a74;--accent:#c8b27a;--accent2:#e8c868;--accent3:#5ab0e8;--red:#ff4444;--purple:#aa88ff;--teal:#3dd6c8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;}
  body{min-height:100vh;}
  a{text-decoration:none;color:inherit;}

  nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:0.05em;}
  .logo span{color:var(--accent);}
  .nav-links{display:flex;gap:0;}
  .nav-link{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1rem;color:var(--text3);transition:color 0.15s;}
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--accent);}

  main{max-width:1300px;margin:0 auto;padding:2rem;display:grid;grid-template-columns:320px 1fr;gap:1.5rem;align-items:start;}

  .panel{background:var(--surface);border:1px solid var(--border);padding:1.25rem;}
  .panel+.panel{margin-top:1rem;}
  .panel-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:1rem;}

  .chip-group{display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:1rem;}
  .chip{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;padding:0.375rem 0.75rem;border:1px solid var(--border2);color:var(--text3);cursor:pointer;background:none;transition:all 0.15s;}
  .chip:hover{color:var(--text);}
  .chip.active{color:var(--bg);background:var(--accent);border-color:var(--accent);}
  .chip.type-sprint.active{background:var(--red);border-color:var(--red);}
  .chip.type-mix.active{background:var(--purple);border-color:var(--purple);}
  .chip.type-distance.active{background:var(--accent3);border-color:var(--accent3);}

  .check-group{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1rem;}
  .check-label{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:0.3rem 0;}
  .check-label input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1px solid var(--border2);background:none;cursor:pointer;position:relative;flex-shrink:0;transition:all 0.15s;}
  .check-label input[type="checkbox"]:checked{background:var(--accent3);border-color:var(--accent3);}
  .check-label input[type="checkbox"]:checked::after{content:'';position:absolute;top:2px;left:4px;width:4px;height:7px;border:2px solid var(--bg);border-top:none;border-left:none;transform:rotate(45deg);}
  .check-label span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text2);}
  .check-label:hover span{color:var(--text);}

  .field-label{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.375rem;}
  .field-group{margin-bottom:1rem;}
  textarea{width:100%;background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:0.5rem 0.625rem;font-family:'DM Mono',monospace;font-size:0.7rem;outline:none;resize:vertical;min-height:56px;}
  textarea::placeholder{color:var(--text3);}
  textarea:focus{border-color:var(--accent3);}

  .btn-generate{width:100%;padding:0.75rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:0.08em;background:var(--accent3);color:var(--bg);border:none;cursor:pointer;transition:opacity 0.15s;}
  .btn-generate:hover{opacity:0.85;}
  .btn-generate:disabled{opacity:0.4;cursor:not-allowed;}

  .history-item{padding:0.75rem;border:1px solid var(--border);cursor:pointer;transition:border-color 0.15s;margin-bottom:0.5rem;}
  .history-item:last-child{margin-bottom:0;}
  .history-item:hover{border-color:var(--border2);}
  .history-item.selected{border-color:var(--accent3);}
  .hi-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:0.3rem;}
  .hi-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.95rem;}
  .hi-date{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);}
  .hi-meta{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;}
  .hi-badge{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;padding:0.1rem 0.4rem;}
  .hi-badge.sprint{background:rgba(255,68,68,0.15);color:var(--red);}
  .hi-badge.mix{background:rgba(170,136,255,0.15);color:var(--purple);}
  .hi-badge.distance{background:rgba(90,176,232,0.15);color:var(--accent3);}

  .workout-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;border:1px solid var(--border);padding:3rem;text-align:center;}
  .workout-empty p{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--text3);margin-bottom:0.4rem;}
  .workout-empty p:first-child{color:var(--text2);}

  .workout-card{background:var(--surface);border:1px solid var(--border);}
  .wc-header{padding:1.5rem;border-bottom:1px solid var(--border);}
  .wc-type-badge{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;padding:0.2rem 0.6rem;margin-bottom:0.75rem;display:inline-block;}
  .wc-type-badge.sprint{background:rgba(255,68,68,0.15);color:var(--red);}
  .wc-type-badge.mix{background:rgba(170,136,255,0.15);color:var(--purple);}
  .wc-type-badge.distance{background:rgba(90,176,232,0.15);color:var(--accent3);}
  .wc-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2rem;letter-spacing:0.02em;margin-bottom:0.25rem;line-height:1.1;}
  .wc-desc{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text3);margin-bottom:0.75rem;}
  .wc-meta{display:flex;gap:1.5rem;flex-wrap:wrap;}
  .wc-meta-item{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);}
  .wc-meta-item span{color:var(--text2);margin-left:0.3rem;}

  .wc-body{padding:1.5rem;}
  .wc-section{margin-bottom:1.5rem;}
  .wc-section:last-child{margin-bottom:0;}
  .wc-section-header{display:flex;align-items:baseline;gap:0.75rem;margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);}
  .wc-section-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:0.06em;}
  .wc-section-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--accent3);}

  .set-row{display:flex;align-items:baseline;gap:0.75rem;padding:0.5rem 0;border-bottom:1px solid var(--border);}
  .set-row:last-child{border-bottom:none;}
  .set-interval{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.1rem;color:var(--accent3);min-width:5rem;text-align:right;flex-shrink:0;}
  .set-stroke{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;flex:1;}
  .set-effort{font-family:'DM Mono',monospace;font-size:0.65rem;flex-shrink:0;}
  .set-effort.easy{color:var(--teal);}
  .set-effort.moderate{color:var(--accent2);}
  .set-effort.hard{color:var(--accent);}
  .set-effort.all-out{color:var(--red);}
  .set-rest{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);flex-shrink:0;}

  .wc-coaching{margin:0 1.5rem 1.5rem;padding:0.875rem;background:rgba(90,176,232,0.05);border-left:2px solid var(--accent3);}
  .wc-coaching-label{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--accent3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.3rem;}
  .wc-coaching-text{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text2);line-height:1.5;}

  .wc-actions{display:flex;gap:0.5rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border);align-items:center;}
  .btn-save{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1.25rem;background:var(--accent3);color:var(--bg);border:none;cursor:pointer;transition:opacity 0.15s;}
  .btn-save:hover{opacity:0.85;}
  .btn-regen{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1.25rem;background:none;border:1px solid var(--border2);color:var(--text3);cursor:pointer;transition:all 0.15s;}
  .btn-regen:hover{color:var(--text);border-color:var(--text3);}
  .saved-label{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--accent3);}

  @media(max-width:900px){
    main{grid-template-columns:1fr;padding:1rem;}
  }
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<main>
  <!-- LEFT SIDEBAR -->
  <div>
    <div class="panel">
      <div class="panel-title">Generate Swim Workout</div>

      <div class="field-group">
        <div class="field-label">Distance (meters)</div>
        <div class="chip-group" id="dist-chips">
          <button class="chip" data-val="500"  onclick="selectDist(this)">500m</button>
          <button class="chip" data-val="1000" onclick="selectDist(this)">1000m</button>
          <button class="chip active" data-val="1500" onclick="selectDist(this)">1500m</button>
          <button class="chip" data-val="2000" onclick="selectDist(this)">2000m</button>
          <button class="chip" data-val="2500" onclick="selectDist(this)">2500m</button>
          <button class="chip" data-val="3000" onclick="selectDist(this)">3000m</button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">Set Type</div>
        <div class="chip-group" id="type-chips">
          <button class="chip type-sprint" data-val="sprint" onclick="selectType(this)">Sprint</button>
          <button class="chip type-mix active" data-val="mix" onclick="selectType(this)">Mix</button>
          <button class="chip type-distance" data-val="distance" onclick="selectType(this)">Slow Distance</button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">Stroke Focus</div>
        <div class="check-group" id="stroke-checks">
          <label class="check-label">
            <input type="checkbox" value="all" checked onchange="handleStrokeCheck(this)">
            <span>All Strokes</span>
          </label>
          <label class="check-label">
            <input type="checkbox" value="freestyle" onchange="handleStrokeCheck(this)">
            <span>Freestyle</span>
          </label>
          <label class="check-label">
            <input type="checkbox" value="sidestroke" onchange="handleStrokeCheck(this)">
            <span>Sidestroke</span>
          </label>
          <label class="check-label">
            <input type="checkbox" value="butterfly" onchange="handleStrokeCheck(this)">
            <span>Butterfly</span>
          </label>
          <label class="check-label">
            <input type="checkbox" value="mix" onchange="handleStrokeCheck(this)">
            <span>Mixed Strokes</span>
          </label>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">Notes (optional)</div>
        <textarea id="workout-notes" placeholder="e.g. focus on turns, needs more rest, open water prep..."></textarea>
      </div>

      <button class="btn-generate" id="gen-btn" onclick="generateWorkout()">~ Generate Swim Workout</button>
    </div>

    <div class="panel">
      <div class="panel-title">Past Workouts</div>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- RIGHT: Workout Display -->
  <div id="workout-display">
    <div class="workout-empty">
      <p>No workout generated yet.</p>
      <p>Set your distance, type, and stroke focus, then hit Generate.</p>
    </div>
  </div>
</main>

<script>
const WORKER_URL = 'https://aged-silence-bd89.samuelwdonovan.workers.dev/';
const STORAGE_KEY = 'swim_workouts';

let selectedDist = 1500;
let selectedType = 'mix';
let currentWorkout = null;
let activeHistoryId = null;

function getSelectedStrokes() {
  return Array.from(document.querySelectorAll('#stroke-checks input:checked')).map(c => c.value);
}

function handleStrokeCheck(el) {
  const all = document.querySelector('#stroke-checks input[value="all"]');
  if (el.value === 'all' && el.checked) {
    document.querySelectorAll('#stroke-checks input').forEach(c => { if (c !== el) c.checked = false; });
  } else if (el.value !== 'all' && el.checked) {
    if (all) all.checked = false;
  }
  if (!getSelectedStrokes().length) {
    if (all) all.checked = true;
  }
}

const SEED_WORKOUTS = [
  {
    id: 'seed-s1', date: '2026-03-10', distance: 1500, type: 'mix', strokes: ['freestyle', 'mix'],
    name: 'Pyramid Blitz',
    description: 'Ascending and descending distances — great for pacing practice',
    sections: [
      {label: 'Warm-Up', totalDistance: 300, sets: [
        {interval: '2 × 100m', stroke: 'Freestyle', effort: 'Easy', rest: ':30', note: 'focus on long stroke'},
        {interval: '1 × 100m', stroke: 'Mix', effort: 'Easy', rest: ':30', note: 'choice of stroke'},
      ]},
      {label: 'Main Set', totalDistance: 1000, sets: [
        {interval: '1 × 50m',  stroke: 'Freestyle', effort: 'Hard', rest: ':20'},
        {interval: '1 × 100m', stroke: 'Freestyle', effort: 'Moderate', rest: ':25'},
        {interval: '1 × 200m', stroke: 'Freestyle', effort: 'Moderate', rest: ':30'},
        {interval: '1 × 100m', stroke: 'Freestyle', effort: 'Hard', rest: ':25'},
        {interval: '1 × 50m',  stroke: 'Freestyle', effort: 'All-Out', rest: ':30', note: 'max effort'},
        {interval: '2 × 250m', stroke: 'Mix',       effort: 'Moderate', rest: ':45'},
      ]},
      {label: 'Cool-Down', totalDistance: 200, sets: [
        {interval: '200m', stroke: 'Freestyle', effort: 'Easy', note: 'slow and controlled'},
      ]},
    ],
    coaching: 'Nail the descending half of the pyramid faster than the ascending — negative-split mindset.'
  },
  {
    id: 'seed-s2', date: '2026-04-02', distance: 2000, type: 'distance', strokes: ['freestyle'],
    name: 'Endurance Base',
    description: 'Long sustained sets with minimal rest — builds aerobic engine',
    sections: [
      {label: 'Warm-Up', totalDistance: 400, sets: [
        {interval: '4 × 100m', stroke: 'Freestyle', effort: 'Easy', rest: ':20'},
      ]},
      {label: 'Main Set', totalDistance: 1400, sets: [
        {interval: '2 × 400m', stroke: 'Freestyle', effort: 'Moderate', rest: '1:00', note: 'consistent pace'},
        {interval: '3 × 200m', stroke: 'Freestyle', effort: 'Moderate', rest: ':30'},
      ]},
      {label: 'Cool-Down', totalDistance: 200, sets: [
        {interval: '200m', stroke: 'Freestyle', effort: 'Easy', note: 'breathe every 5 strokes'},
      ]},
    ],
    coaching: 'Pick a pace you can hold across ALL the 400s. If the second one feels harder, you went out too fast.'
  },
];

function getWorkouts() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!stored) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_WORKOUTS));
      return SEED_WORKOUTS;
    }
    return stored;
  } catch { return SEED_WORKOUTS; }
}

function saveWorkoutToHistory(wo) {
  const existing = getWorkouts().filter(w => w.id !== wo.id);
  const updated = [wo, ...existing].slice(0, 30);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
  renderHistory();
}

function selectDist(el) {
  document.querySelectorAll('#dist-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedDist = parseInt(el.dataset.val);
}

function selectType(el) {
  document.querySelectorAll('#type-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedType = el.dataset.val;
}

function typeLabel(t) {
  return {sprint: 'Sprint', mix: 'Mix', distance: 'Slow Distance'}[t] || t;
}

function effortClass(effort) {
  if (!effort) return '';
  const e = effort.toLowerCase();
  if (e.includes('all') || e.includes('max')) return 'all-out';
  if (e.includes('hard')) return 'hard';
  if (e.includes('mod')) return 'moderate';
  return 'easy';
}

function renderHistory() {
  const workouts = getWorkouts();
  const el = document.getElementById('history-list');
  if (!workouts.length) {
    el.innerHTML = '<div style="color:var(--text3);font-family:\'DM Mono\',monospace;font-size:0.7rem">No past workouts yet.</div>';
    return;
  }
  el.innerHTML = workouts.map(w => `
    <div class="history-item${activeHistoryId === w.id ? ' selected' : ''}" onclick="showHistoryWorkout('${w.id}')">
      <div class="hi-top">
        <span class="hi-name">${w.name}</span>
        <span class="hi-date">${w.date}</span>
      </div>
      <div class="hi-meta">
        <span class="hi-badge ${w.type}">${typeLabel(w.type)}</span>
        ${w.distance}m &middot; ${(w.strokes || []).join(', ')}
      </div>
    </div>
  `).join('');
}

function showHistoryWorkout(id) {
  const wo = getWorkouts().find(w => w.id === id);
  if (!wo) return;
  activeHistoryId = id;
  currentWorkout = wo;
  renderHistory();
  renderWorkout(wo, false);
}

function renderWorkout(wo, isNew) {
  const typeCls = (wo.type || 'mix').toLowerCase();

  const sectionsHtml = (wo.sections || []).map(sec => `
    <div class="wc-section">
      <div class="wc-section-header">
        <span class="wc-section-label">${sec.label}</span>
        ${sec.totalDistance ? `<span class="wc-section-sub">${sec.totalDistance}m</span>` : ''}
      </div>
      ${(sec.sets || []).map(s => `
        <div class="set-row">
          <span class="set-interval">${s.interval || ''}</span>
          <span class="set-stroke">${s.stroke || ''}</span>
          <span class="set-effort ${effortClass(s.effort)}">${s.effort || ''}</span>
          ${s.rest ? `<span class="set-rest">${s.rest} rest</span>` : ''}
          ${s.note ? `<span class="set-rest">${s.note}</span>` : ''}
        </div>`).join('')}
    </div>`).join('');

  document.getElementById('workout-display').innerHTML = `
    <div class="workout-card">
      <div class="wc-header">
        <div class="wc-type-badge ${typeCls}">${typeLabel(wo.type)}</div>
        <div class="wc-name">${wo.name}</div>
        <div class="wc-desc">${wo.description}</div>
        <div class="wc-meta">
          <div class="wc-meta-item">DISTANCE<span>${wo.distance}m</span></div>
          <div class="wc-meta-item">TYPE<span>${typeLabel(wo.type)}</span></div>
          <div class="wc-meta-item">STROKES<span>${(wo.strokes || []).join(', ')}</span></div>
          <div class="wc-meta-item">DATE<span>${wo.date}</span></div>
        </div>
      </div>
      <div class="wc-body">${sectionsHtml}</div>
      ${wo.coaching ? `
      <div class="wc-coaching">
        <div class="wc-coaching-label">Coach's Note</div>
        <div class="wc-coaching-text">${wo.coaching}</div>
      </div>` : ''}
      <div class="wc-actions">
        ${isNew
          ? `<button class="btn-save" onclick="saveCurrentWorkout()">Save to History</button>`
          : `<span class="saved-label">✓ Saved</span>`}
        <button class="btn-regen" onclick="generateWorkout()">↺ Regenerate</button>
      </div>
    </div>`;
}

function saveCurrentWorkout() {
  if (!currentWorkout) return;
  saveWorkoutToHistory(currentWorkout);
  renderWorkout(currentWorkout, false);
}

async function generateWorkout() {
  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.textContent = 'Generating...';
  activeHistoryId = null;
  currentWorkout = null;
  renderHistory();

  document.getElementById('workout-display').innerHTML = `
    <div class="workout-empty">
      <p style="color:var(--accent3)">Generating your swim workout...</p>
      <p>Claude is drawing up the lanes.</p>
    </div>`;

  const strokes = getSelectedStrokes();
  const recentNames = getWorkouts().slice(0, 6).map(w => `"${w.name}" (${typeLabel(w.type)}, ${w.distance}m)`).join(', ');
  const notes = document.getElementById('workout-notes').value.trim();

  const typeDesc = {
    sprint: 'short, fast interval sets (25–100m) with full recovery — high intensity, short rest',
    mix:    'variety of interval lengths and intensities — balanced warm-up, main set, cool-down',
    distance: 'longer continuous or near-continuous sets (200m+) at steady moderate pace — low rest',
  }[selectedType];

  const strokeDesc = strokes.includes('all')
    ? 'any strokes (freestyle, sidestroke, butterfly, backstroke, breaststroke, IM)'
    : strokes.join(', ');

  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1400,
        system: `You are an elite swim coach who writes structured, creative pool workouts. Structure every workout with Warm-Up, Main Set, and Cool-Down sections. Use standard swim interval notation: "4 × 100m", "200m", "6 × 50m". Distances are in meters. For effort use: Easy, Moderate, Hard, or All-Out. Rest periods use format like ":20", ":30", "1:00". Sections should have a totalDistance property (sum of all set distances in that section). Strokes: Freestyle, Backstroke, Breaststroke, Butterfly, Sidestroke, IM (Individual Medley), Mix, Choice. Be creative with main set structure — ladders, descending rest, broken swims, negative splits, etc. Always vary structure from recent workouts.

Return ONLY valid JSON with no other text:
{"name":"workout name","type":"sprint|mix|distance","description":"one-line hook","sections":[{"label":"Warm-Up","totalDistance":300,"sets":[{"interval":"2 × 100m","stroke":"Freestyle","effort":"Easy","rest":":30","note":"optional"}]},{"label":"Main Set","totalDistance":900,"sets":[...]},{"label":"Cool-Down","totalDistance":200,"sets":[...]}],"coaching":"1-2 sentence coaching tip"}`,
        messages: [{role: 'user', content: `Create a ${selectedDist}m swim workout. Type: ${typeDesc}. Strokes to use: ${strokeDesc}. The distances across all sections must sum to exactly ${selectedDist}m. Recent workouts to avoid repeating: ${recentNames || 'none yet'}. ${notes ? `Additional notes: ${notes}.` : ''} Be creative and vary the structure from recent history.`}]
      })
    });

    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || 'API error');
    const raw = data.content[0].text.replace(/```json|```/g, '').trim();
    const wo = JSON.parse(raw);

    const today = new Date().toISOString().split('T')[0];
    currentWorkout = {
      ...wo,
      id: `sw-${Date.now()}`,
      date: today,
      distance: selectedDist,
      strokes,
    };

    renderWorkout(currentWorkout, true);
  } catch(e) {
    document.getElementById('workout-display').innerHTML = `
      <div class="workout-empty">
        <p style="color:var(--red)">Generation failed.</p>
        <p>${e.message}</p>
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '~ Generate Swim Workout';
  }
}

renderHistory();
</script>
<script src="local-config.js" onerror="void 0"></script>
<script src="nav.js"></script>
<script>renderNav('swim');</script>
</body>
</html>
